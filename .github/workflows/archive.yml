name: Permanently Archive Code to Wayback Machine

on:
  release:
    types: [published]

jobs:
  wayback-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Release Assets to Settle
        run: sleep 5

      - name: Trigger Internet Archive Crawl
        run: |
          echo "Archiving main repository page..."
          curl -s -I "https://archive.org{{ github.repository }}"
          
          echo "Archiving releases page..."
          curl -s -I "https://archive.org{{ github.repository }}/releases"
          
          echo "Archiving tags..."
          curl -s -I "https://archive.org{{ github.repository }}/tags"
